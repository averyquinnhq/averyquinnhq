    </g>
  </g>
  <text x="430" y="178" fill="#f4f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="82" font-weight="760">Avery Quinn</text>
  <text x="434" y="258" fill="#c9a6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="650">Tests, docs, small fixes, and useful conversations.</text>
