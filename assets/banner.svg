<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040812"/>
      <stop offset="0.56" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#17102a"/>
    </linearGradient>
    <radialGradient id="wash" cx="78%" cy="38%" r="62%">
      <stop offset="0" stop-color="#7d43e8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7d43e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0.18" y1="0.1" x2="0.82" y2="0.9">
      <stop offset="0" stop-color="#d08aff"/>
      <stop offset="0.5" stop-color="#9558ff"/>
      <stop offset="1" stop-color="#6b39dc"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
